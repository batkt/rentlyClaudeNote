# rentlyClaudeNote — turees «Claude ажил» цонхны ажлуудыг Claude Code-оор гүйцэтгэгч.
# Энэ файлыг rentlyClaudeNote.exe-ийн хажууд config.toml нэрээр хуулж бөглөнө
# (config.toml нь .gitignore-д орсон).

# /claudeAjil route-ийг deploy хийсэн backend (turees frontend services/uilchilgee.js-ийн url)
url = "https://rently.zevtabs.mn/api"

# /claudeAjil endpoint-ууд Zevtabs байгууллагын CAdmin1 эрх шаарддаг (tokenShalgakh + adminShalgay).
# Бэлэн JWT өгөх, эсвэл нэвтрэх нэр/нууц үгээр автоматаар token авна.
# Token-ий хугацаа дуусахад (401) нэвтрэх нэр/нууц үг байвал дахин нэвтэрнэ.
token = ""
nevtrekhNer = "CAdmin1"
nuutsUg = ""
baiguullagiinId = "612f457d185280db676d0b51"

# Хүлээгдэж буй (shine) ажлыг хэдэн секунд тутамд шалгах
shalgakh_secs = 60
timeout_secs = 20

# Зэрэг ажиллах Claude ажлын дээд тоо (бичээгүй бол 1 — нэг нэгээр).
# Repo нь давхцсан ажлууд (жишээ нь ParkEase, Rently хоёул turees ашиглана;
# «Бүх систем» бүх repo-г) хэзээ ч зэрэг ажиллахгүй — «Хүлээгдэж буй»
# төлөвтөө үлдэж, repo нь чөлөөлөгдсөний дараа илгээсэн дарааллаараа эхэлнэ.
# Ажил бүр budget_usd хүртэл зарцуулна — зэрэг 3 бол нэгэн зэрэг 3× зардал.
zereg_max = 3

# Цонхонд систем сонгоход backend (tureesBack models/claudeAjil.js#SYSTEMUUD)
# тухайн системийн repo-уудыг өгнө. Repo бүрийн зам:
#   1) [repos]-д нэрээр нь тохируулсан бол тэр зам
#   2) эс бөгөөс <repo_undsen>/<repo нэр>
# Энэ компьютер дээр олдоогүй repo-г алгасч (явцад ⚠ гэж харагдана) үлдсэн
# дээр нь ажиллана; нэг ч олдохгүй бол ажил алдаатай дуусна.
repo_undsen = "D:/Work"

# Зөвхөн repo_undsen-ээс өөр газар байгаа repo-г энд бичнэ.
[repos]
# turees = "E:/busad/turees"

[claude]
exe = "C:/Users/pc/.local/bin/claude.exe"
budget_usd = 5.0        # нэг ажлын зардлын дээд хязгаар
timeout_min = 60
# VS Code-ийн Claude-тай ижил чанартай байхын тулд opus. Хоосон бол Claude Code-ийн
# headless анхдагч загвар (Sonnet) ажиллана.
model = "opus"
# false бол commit хийгдээгүй өөрчлөлттэй repo-д ажиллахгүй (таны ажлыг хамгаална).
# true бол тухайн өөрчлөлтийн дээр нэмж засна — зөвхөн өөрийн компьютер дээр.
bokhir_repo_zuvshuurukh = false
# Ажил эхлэхийн өмнө service repo бүрт `git pull --ff-only` хийнэ (Claude өөрөө
# pull хийх эрхгүй). Цэвэр repo-г шинэчилж чадаагүй бол хуучирсан код дээр
# ажиллаж merge зөрчил үүсгэхгүйн тулд ажил aldaa болно. Upstream-гүй branch-ийг алгасна.
git_pull = true
