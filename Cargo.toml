[package]
name = "rently-claude-note"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rentlyClaudeNote"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
windows-service = "0.6"

[profile.release]
opt-level = 3
lto = true
strip = true
